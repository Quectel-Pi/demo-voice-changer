<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Soundstage Lavender voice changer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a68cc"/>
      <stop offset="0.55" stop-color="#5b3f94"/>
      <stop offset="1" stop-color="#2f1f52"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eadffb"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <circle cx="128" cy="110" r="70" fill="#ffffff" opacity="0.06"/>
  <!-- waveform accents -->
  <path d="M56 92 v40 M72 80 v64 M88 100 v24 M168 100 v24 M184 80 v64 M200 92 v40"
        fill="none" stroke="#d8c7f4" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <!-- microphone capsule -->
  <rect x="103" y="50" width="50" height="88" rx="25" fill="url(#mic)"/>
  <rect x="119" y="64" width="8" height="56" rx="4" fill="#c3ade9" opacity="0.85"/>
  <!-- cradle arc -->
  <path d="M82 106 v14 a46 46 0 0 0 92 0 v-14" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
  <!-- stand -->
  <path d="M128 166 v26" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
  <path d="M98 198 h60" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
</svg>
